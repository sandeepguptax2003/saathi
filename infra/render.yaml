# Render Blueprint for the Saathi API (free web service, Docker, Singapore).
# Point the Render Blueprint at this file: Dashboard -> Blueprints -> New -> path "infra/render.yaml".
# Keys only. Every value is entered in the Render dashboard (sync: false) and never committed.
# Render auto-deploys on every push to main that touches apps/api.
services:
  - type: web
    name: saathi-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeployTrigger: "commit"
    buildFilter:
      paths:
        - apps/api/**
    envVars:
      - key: ENV
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        sync: false
      - key: MODEL_FAST
        sync: false
      - key: MODEL_REASONING
        sync: false
      - key: MODEL_EMBED
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_PGBOUNCER
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Render generates a random 256-bit value once at creation. Never regenerate: it keys stored ciphertext.
      - key: ENCRYPTION_PEPPER
        generateValue: true
      - key: DAILY_BUDGET_USD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
