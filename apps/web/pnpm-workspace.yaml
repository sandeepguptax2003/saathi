# apps/web is installed standalone (`cd apps/web && pnpm install`).
# pnpm >= 11 fails the install on unapproved build scripts; approve the ones we need.
# If a root workspace is added later, move `allowBuilds` there and delete this file.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true
  "@tailwindcss/oxide": true

# next pins postcss 8.4.31 (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849 and others); force the patched line.
overrides:
  postcss: ">=8.5.18 <9"
  # @serwist/* pins zod 4.6.5 (GHSA-mrhx-c7xc-m3w5); force the patched line.
  zod: ">=4.6.6 <5"
