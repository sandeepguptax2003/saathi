[project]
name = "saathi-api"
version = "0.1.0"
description = "Saathi API: private Hindi-English voice assistant backend (FastAPI modular monolith)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "openai>=1.50",
    "structlog>=24.4",
    "cryptography>=43",
    "sentry-sdk[fastapi]>=2.18",
    "pyjwt[crypto]>=2.9",
    "orjson>=3.10",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saathi_api"]

[tool.uv]
package = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC",
    "PT", "RET", "PL", "TID", "ARG", "DTZ", "T20", "ERA", "PERF", "FAST",
]
ignore = [
    "PLR0913",  # FastAPI handlers/services take many deps by design
    "PLR2004",  # magic values are fine in a few validators
    "RUF001", "RUF002", "RUF003",  # Hindi / rupee glyphs in strings are intentional
    "N818",     # domain errors read better as NotFound / Conflict than NotFoundError
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "PLR2004", "ARG001", "ARG002", "PLR0915", "PT018", "PT011",
    "N806", "RUF059", "PLC0415", "E501",
]
# Protocol implementations (mock backend, browser voice placeholders) accept unused args.
"src/saathi_api/modules/llm/repository.py" = ["ARG002"]
"src/saathi_api/modules/voice/service.py" = ["ARG002"]
"migrations/**" = ["E501", "ERA001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["saathi_api"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a real Postgres (TEST_DATABASE_URL)"]
filterwarnings = ["error::DeprecationWarning:saathi_api.*"]

[tool.coverage.run]
source = ["saathi_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
