name: Keepalive

# Backup pinger. Primary is cron-job.org every 10 min. GitHub cron can lag and is
# paused after 60 days without repo activity.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL || secrets.API_URL }}
    steps:
      - name: Ping /health
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL not configured; nothing to ping."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 "$API_URL/health"
